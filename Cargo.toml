[package]
name = "apple-signin"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Peter Todorov <me@peterprototypes.com>"]
description = "Decodes and validates identity tokens generated via Sign in with Apple"
repository = "https://github.com/peterprototypes/apple-signin"
documentation = "https://docs.rs/apple-signin"
readme = "README.md"
keywords = ["apple", "signin", "jwt"]
categories = ["api-bindings"]

[features]
native-tls = ["reqwest/native-tls"]
# reqwest 0.13 renamed `rustls-tls` to `rustls`; the feature name here is kept.
rustls-tls = ["reqwest/rustls"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_repr = "0.1"
jsonwebtoken = { version = "12", default-features = false, features = [
    "rust_crypto",
] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
async-lock = "3.4"

[dev-dependencies]
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
